name: Deploy — GitHub Pages (version web)

on:
  push:
    branches: ["main", "claude/evolution-game-project-ENvTm"]
  workflow_dispatch:

permissions:
  contents: write   # needed by peaceiris/actions-gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install pygame pygbag

      - name: Compiler en WebAssembly avec Pygbag
        # --build  → produit build/web/ sans lancer de serveur local
        # --ume_block 0 → évite les blocages asynchrones dans la boucle de jeu
        run: python -m pygbag --build --ume_block 0 --app_name "JeuMonde" main.py

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: mise à jour du monde [skip ci]"
